<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们在一起的时光</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* 漂浮爱心动画 */
        .heart {
            position: absolute;
            color: #fff;
            opacity: 0.6;
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0% {transform: translateY(100vh) rotate(0deg);opacity:0;}
            10% {opacity:0.7;}
            90% {opacity:0.6;}
            100% {transform: translateY(-10vh) rotate(360deg);opacity:0;}
        }
        .box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(255, 80, 120, 0.2);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 9;
        }
        .title {
            font-size: 32px;
            color: #fff;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(220, 60, 90, 0.3);
        }
        .time-wrap {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .item {
            background: rgba(255,255,255,0.35);
            width: 90px;
            height: 110px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #c82348;
        }
        .num {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .text {
            font-size: 14px;
            opacity: 0.85;
        }
        .tip {
            margin-top: 30px;
            color: #fff;
            font-size: 16px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1 class="title">💌 我们在一起</h1>
        <div class="time-wrap">
            <div class="item">
                <div class="num" id="day">0</div>
                <div class="text">天</div>
            </div>
            <div class="item">
                <div class="num" id="hour">0</div>
                <div class="text">时</div>
            </div>
            <div class="item">
                <div class="num" id="min">0</div>
                <div class="text">分</div>
            </div>
            <div class="item">
                <div class="num" id="sec">0</div>
                <div class="text">秒</div>
            </div>
        </div>
        <p class="tip">岁岁年年，只想和你</p>
    </div>

    <script>
        // ========== 修改这里：你们在一起的日期 年,月-1,日,时,分,秒 ==========
        const loveStart = new Date(2026, 1, 3, 0, 0, 0);
        // =================================================================

        // 生成漂浮爱心
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '♥';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 24 + 12 + 'px';
            heart.style.animationDelay = Math.random() * 8 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 16000);
        }
        setInterval(createHeart, 600);

        // 计时逻辑
        const dayDom = document.getElementById('day');
        const hourDom = document.getElementById('hour');
        const minDom = document.getElementById('min');
        const secDom = document.getElementById('sec');

        function updateTime() {
            const now = new Date();
            let diff = now - loveStart;
            if (diff < 0) {
                dayDom.innerText = '0';
                hourDom.innerText = '0';
                minDom.innerText = '0';
                secDom.innerText = '0';
                return;
            }

            const day = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff %= 1000 * 60 * 60 * 24;
            const h = Math.floor(diff / (1000 * 60 * 60));
            diff %= 1000 * 60 * 60;
            const m = Math.floor(diff / (1000 * 60));
            diff %= 1000 * 60;
            const s = Math.floor(diff / 1000);

            dayDom.innerText = day;
            hourDom.innerText = h;
            minDom.innerText = m;
            secDom.innerText = s;
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
